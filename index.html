<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTF Gang Sheet Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --accent: #f0ff44;
    --accent2: #44ffcc;
    --text: #f0f0f0;
    --muted: #777;
    --best: #44ffcc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    margin-top: 8px;
  }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }

  @media (max-width: 600px) {
    .inputs { grid-template-columns: 1fr; }
    header h1 { font-size: 1.8rem; }
  }

  .field label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 14px 16px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .field input:focus {
    border-color: var(--accent);
  }

  .field .unit {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Results */
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .results-header h2 {
    font-size: 0.75rem;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .best-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    background: var(--accent2);
    color: #000;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
  }

  thead th {
    text-align: left;
    padding: 10px 14px;
    color: var(--muted);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:hover {
    background: var(--surface2);
  }

  tbody tr.best-row {
    background: rgba(68, 255, 204, 0.06);
    border-left: 3px solid var(--best);
  }

  tbody tr.best-row td:first-child {
    padding-left: 11px;
  }

  tbody td {
    padding: 13px 14px;
    color: var(--text);
  }

  tbody td.size-cell {
    font-weight: 700;
    font-size: 0.85rem;
  }

  tbody td.price-cell {
    color: var(--accent);
    font-weight: 700;
  }

  tbody td.best-cell {
    color: var(--best);
    font-weight: 700;
  }

  tbody td.margin-cell {
    color: #ff9f44;
    font-weight: 700;
  }

  .summary-bar {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  @media (max-width: 600px) {
    .summary-bar { grid-template-columns: 1fr 1fr; }
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .stat-card .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-card .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-card.highlight {
    border-color: var(--accent2);
  }

  .stat-card.highlight .stat-value {
    color: var(--accent2);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  .shipping-banner {
    margin-top: 14px;
    padding: 12px 18px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .shipping-banner.free {
    background: rgba(68, 255, 204, 0.1);
    border: 1px solid var(--accent2);
    color: var(--accent2);
  }

  .shipping-banner.paid {
    background: rgba(240, 255, 68, 0.07);
    border: 1px solid rgba(240, 255, 68, 0.3);
    color: var(--accent);
  }

  .page-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
  }

  .page-nav a {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 8px 18px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.15s;
  }

  .page-nav a.active {
    background: var(--accent);
    color: #000;
  }

  .page-nav a.inactive {
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .page-nav a.inactive:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>DTF Gang Sheet<br><span>Cost Calculator</span></h1>
    <p>// dtfnc.com pricing — ¼" bleed + ⅛" margin per graphic — internal use only</p>
  </header>

    <nav class="page-nav">
    <a href="index.html" class="active">DTF</a>
    <a href="uvdtf-calculator.html" class="inactive">UV DTF</a>
  </nav>

  <div class="inputs">
    <div class="field">
      <label>Graphic Width</label>
      <input type="number" id="width" placeholder="0" min="0.1" step="0.1" oninput="calculate()">
      <div class="unit">inches</div>
    </div>
    <div class="field">
      <label>Graphic Height</label>
      <input type="number" id="height" placeholder="0" min="0.1" step="0.1" oninput="calculate()">
      <div class="unit">inches</div>
    </div>
    <div class="field">
      <label>Quantity Needed</label>
      <input type="number" id="qty" placeholder="0" min="1" step="1" oninput="calculate()">
      <div class="unit">prints</div>
    </div>
  </div>

  <div id="output">
    <div class="empty-state">↑ Enter graphic dimensions and quantity to calculate</div>
  </div>
</div>

<script>
  const SHEETS = [
    { size: '22" × 12"',  price: 6,  height: 12  },
    { size: '22" × 24"',  price: 12, height: 24  },
    { size: '22" × 36"',  price: 18, height: 36  },
    { size: '22" × 48"',  price: 24, height: 48  },
    { size: '22" × 60"',  price: 30, height: 60  },
    { size: '22" × 80"',  price: 40, height: 80  },
    { size: '22" × 100"', price: 50, height: 100 },
    { size: '22" × 120"', price: 56, height: 120 },
    { size: '22" × 140"', price: 64, height: 140 },
    { size: '22" × 160"', price: 70, height: 160 },
    { size: '22" × 180"', price: 78, height: 180 },
    { size: '22" × 200"', price: 86, height: 200 },
  ];

  const SHEET_WIDTH = 22;

  function calculate() {
    const w = parseFloat(document.getElementById('width').value);
    const h = parseFloat(document.getElementById('height').value);
    const qty = parseInt(document.getElementById('qty').value);

    if (!w || !h || !qty || w <= 0 || h <= 0 || qty <= 0) {
      document.getElementById('output').innerHTML = '<div class="empty-state">↑ Enter graphic dimensions and quantity to calculate</div>';
      return;
    }

    // Add 0.25" bleed on each side + 0.125" margin between graphics
    const gw = w + 0.5 + 0.125;
    const gh = h + 0.5 + 0.125;

    const results = SHEETS.map(sheet => {
      const cols = Math.floor(SHEET_WIDTH / gw);
      const rows = Math.floor(sheet.height / gh);
      const fitsPerSheet = cols * rows;

      if (fitsPerSheet === 0) return null;

      const sheetsNeeded = Math.ceil(qty / fitsPerSheet);
      const totalCost = sheetsNeeded * sheet.price;
      const totalPrints = sheetsNeeded * fitsPerSheet;
      const leftover = totalPrints - qty;
      const costPerPrint = totalCost / qty;
      const pricePerPrint = costPerPrint * 1.15;

      return {
        ...sheet,
        fitsPerSheet,
        sheetsNeeded,
        totalCost,
        leftover,
        costPerPrint,
        pricePerPrint
      };
    }).filter(Boolean);

    if (results.length === 0) {
      document.getElementById('output').innerHTML = '<div class="empty-state">Graphic is too large for any available sheet size.</div>';
      return;
    }

    // Best value = lowest cost per print
    const bestIdx = results.reduce((bi, r, i) => r.costPerPrint < results[bi].costPerPrint ? i : bi, 0);
    const best = results[bestIdx];

    let rows = results.map((r, i) => {
      const isBest = i === bestIdx;
      return `
        <tr class="${isBest ? 'best-row' : ''}">
          <td class="size-cell">${r.size}</td>
          <td class="price-cell">$${r.price.toFixed(2)}</td>
          <td>${r.fitsPerSheet}</td>
          <td>${r.sheetsNeeded}</td>
          <td>$${r.totalCost.toFixed(2)}</td>
          <td>${r.leftover}</td>
          <td class="${isBest ? 'best-cell' : ''}">$${r.costPerPrint.toFixed(3)}</td>
          <td class="margin-cell">$${r.pricePerPrint.toFixed(3)}</td>
          <td>${isBest ? '✦ BEST' : ''}</td>
        </tr>
      `;
    }).join('');

    const shippingBanner = best.totalCost >= 100
      ? '<div class="shipping-banner free">✦ FREE SHIPPING — Order total exceeds $100</div>'
      : '<div class="shipping-banner paid">⚑ Add $' + (100 - best.totalCost).toFixed(2) + ' more to qualify for free shipping</div>';

    document.getElementById('output').innerHTML = `
      <div class="summary-bar">
        <div class="stat-card highlight">
          <div class="stat-label">Best Value Size</div>
          <div class="stat-value">${best.size}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Cost</div>
          <div class="stat-value">$${best.totalCost.toFixed(2)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Cost Per Print</div>
          <div class="stat-value">$${best.costPerPrint.toFixed(3)}</div>
        </div>
      </div>

      ${shippingBanner}

      <hr class="divider">

      <div class="results-header">
        <h2>All Sheet Options</h2>
        <span class="best-badge">✦ = best value</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Sheet Size</th>
            <th>Price</th>
            <th>Fits/Sheet</th>
            <th>Sheets Needed</th>
            <th>Total Cost</th>
            <th>Leftover</th>
            <th>Cost/Print</th>
            <th>Price/Print (15%)</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
</script>
</body>
</html>
